        <style>
            #listArea {
                position: fixed;
                left: 0px;
                width: 280px;
                height: calc(100% - 70px);
                display: flex;
                flex-direction: column;
                padding: 10px 10px 60px 10px;
                overflow-y: auto;
                scrollbar-width: none;
                transition: all 0.5s ease-in-out;
                background-color: #8c8c8c;
            }
            #pageArea {
                position: absolute;
                right: 0px;
                top: 0px;
                width: calc(100% - 300px);
                height: 100%;
                display: flex;
                flex-direction: column;
                background-color: #bfbfbf;
            }
            .listItem {
                width: calc(100% - 10px);
                height: auto;
                min-height: 40px;
                padding: 5px;
                display: flex;
                align-items: center;
                gap: 10px;
                cursor: pointer;
                background-color: #595959;
            }
            .listItem div {
                width: 100%;
                text-align: center;
                font-size: 24px;
                color: white;
            }
            .listItem img {
                width: 40px;
                height: 40px;
                min-width: 40px;
                min-height: 40px;
                border-radius: 14px;
            }
        </style>

                if (id != "") temp.id = id;
                if (classList != "") temp.classList.add(classList);

                parent.appendChild(temp);
