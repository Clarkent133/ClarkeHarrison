n\t})\n\n\tsocket.on(\"promptAI\", (messages) => {\n\t\taskAI(messages , (reply) => {socket.emit(\"promptAI\" , reply)});\n\t})\n\n\tsocket.on('restart', () => {\n\t\t\trestartServer();\n\t})\n})\n\n\nconst PORT = 3000;\nserver.listen(PORT, () => {\n    console.log(`Server running with Address : ${localIPs[0]}:3000`);\n}); \n"

        "noteArea.innerHTML = `\n\n<br><br>\nSetup\n<br><br>\nUse the custom 52-card deck, two six-sided dice (2d6), and the app or printable version. Each player chooses one Character card to form their Field; remove the others. Shuffle the remaining cards to create the World Deck, then draw two cards each. Read the World Setup from the app to begin the story.\n<br><br>\nTaking Turns\n<br><br>\nOn your turn, draw one card, then choose to either play an Ally to your Field, reveal and fight a Monster from your hand, or fight another Player. After resolving your action, the next player takes their turn clockwise.\n<br><br>\nInstants & Events\n<br><br>\nInstants can be played at any time unless stated otherwise, then placed on the bottom of the deck. Some cards trigger Events — when this happens, use the app to generate and read the Event aloud. Follow its instructions; some may lead to a Final Event, which determines how the game ends.\n<br><br>\nActions & Combat\n<br><br>\nWhen making an Action, roll 2d6 and add modifiers from your Field; the total is your Action Score (AS) for that action. In Combat, both sides roll Physical Actions — the lower AS takes one Damage (ties have no effect). Monsters do not roll; their AS is shown on their card. Damage can be assigned between your Character and Allies; defeated Allies are discarded. Defeated Monsters are placed under your Character, granting their Item effect. If your Character takes damage equal to its Life, you’re out.\n<br><br><br><br>\n\n<canvas id=\"cnv\" width=\"250\" height=\"350\" style=\"width:250px; height:350px;\"></canvas>\n\n`;\n\nnoteList.style.top = \"-100%\";\n\nconst cnv = document.getElementById(\"cnv\");\nconst ctx = cnv.getContext(\"2d\");\n\nconst mantisColours = [\n  \"#FF0000\", // Red\n  \"#00FF00\", // Lime\n  \"#0000FF\", // Blue\n  \"#FFFF00\", // Yellow\n  \"#FF00FF\", // Magenta\n  \"#00FFFF\", // Cyan\n  \"#FFA500\", // Orange\n  \"#800080\", // Purple\n  \"#008000\"  // Green (darker)\n];\n nction drawText(x,y,w,h,t,font=\"16px sans-serif\"){\n  ctx.save(); ctx.font=font; ctx.textAlign=\"center\"; ctx.textBaseline=\"alphabetic\";\n  const m=ctx.measureText(\"Mg\"), a=m.actualBoundingBoxAscent||0, d=m.actualBoundingBoxDescent||0,\n        fs=parseFloat(/(\\d+(?:\\.\\d+)?)px/.exec(ctx.font)?.[1]||16),\n        lh=a+d||fs*1.2, asc=a||fs*.8, cx=x+w/2;\n  const wrap=s=>{\n    const L=[], mw=w;\n    for(const p of s.split(/\\r?\\n/)){ let l=\"\";\n      for(const w2 of p.split(/\\s+/)){\n        if(ctx.measureText(w2).width>mw){\n          if(l) L.push(l),l=\"\";\n          let c=\"\"; for(const ch of w2){\n            const t2=c+ch; ctx.measureText(t2).width<=mw?c=t2:(L.push(c),c=ch);\n          } l=c; continue;\n        }\n        const t2=l?l+\" \"+w2:w2;\n        ctx.measureText(t2).width<=mw?l=t2:(L.push(l),l=w2);\n      }\n      L.push(l);\n    } return L;\n  };\n  const lines=wrap(t), bh=lines.length*lh, sy=y+(h-bh)/2+asc;\n  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();\n  lines.forEach((l,i)=>ctx.fillText(l,cx,sy+i*lh));\n  ctx.restore();\n}\n\n\n\n\n\n/*\n\nSetup\nUse the custom 52-card deck, two six-sided dice (2d6), and the app or printable version. Each player chooses one Character card to form their Field; remove the others. Shuffle the remaining cards to create the World Deck, then draw two cards each. Read the World Setup from the app to begin the story.\nTaking Turns\nOn your turn, draw one card, then choose to either play an Ally to your Field, reveal and fight a Monster from your hand, or fight another Player. After resolving your action, the next player takes their turn clockwise.\nInstants & Events\nInstants can be played at any time unless stated otherwise, then placed on the bottom of the deck. Some cards trigger Events — when this happens, use the app to generate and read the Event aloud. Follow its instructions; some may lead to a Final Event, which determines how the game ends.\nActions & Combat\nWhen making an Action, roll 2d6 and add modifiers from your Field; the total is your Action Score (AS) for that action. In Combat, both sides roll Physical Actions — the lower AS takes one Damage (ties have no effect). Monsters do not roll; their AS is shown on their card. Damage can be assigned between your Character and Allies; defeated Allies are discarded. Defeated Monsters are placed under your Character, granting their Item effect. If your Character takes damage equal to its Life, you’re out.\n\nAce -> Characters\n2-6 -> Actions\n7-10 -> Items/Monsters\nJ-K -> Allies\n\nmantis\n\nqr\n\nnumbered 1-54 (The Mind game)\n\n*/\n\n\n\n\n\n"

-------------------------------------------------------------\n\n -- RELOAD CADDY\nsudo systemctl reload caddy\n\n\n\n\n -- INSTALL DOCKER\nsudo apt update\nsudo apt install -y ca-certificates curl gnupg lsb-release\nsudo mkdir -p /etc/apt/keyrings\ncurl -fsSL https://download.docker.com/linux/ubuntu/gpg | \\\n  sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg\necho \\\n  \"deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \\\n  https://download.docker.com/linux/ubuntu \\\n  $(lsb_release -cs) stable\" | \\\n  sudo tee /etc/apt/sources.list.d/docker.list > /dev/null\nsudo apt update\nsudo apt install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin\nsudo systemctl enable docker\nsudo systemctl start docker\n\n\n -- CHECK DOCKER\n docker --version\ndocker compose version\nsudo docker run hello-world\n\n\n\n\n\n\n\n\n\n\n\n -- INSTALL NEXTCLOUD TO PORT 8080\nsudo mkdir -p /mnt/storage/nextcloud\ncd /mnt/storage/nextcloud\nsudo nano docker-compose.yml\n-----------------------------------------------------------------\nversion: \"3.8\"\n\nservices:\n  db:\n    image: postgres:15\n    container_name: nextcloud-db\n    restart: unless-stopped\n    environment:\n      POSTGRES_USER: nextcloud\n      POSTGRES_PASSWORD: nextcloud\n      POSTGRES_DB: nextcloud\n    volumes:\n      - ./db:/var/lib/postgresql/data\n    networks:\n      - nextcloud-net\n\n  app:\n    image: nextcloud\n    container_name: nextcloud-app\n    restart: unless-stopped\n    ports:\n      - \"8080:80\"   # Nextcloud UI at http://localhost:8080\n    environment:\n      POSTGRES_HOST: db\n      POSTGRES_USER: nextcloud\n      POSTGRES_PASSWORD: nextcloud\n      POSTGRES_DB: nextcloud\n    volumes:\n      - ./nextcloud:/var/www/html\n    depends_on:\n      - db\n    networks:\n      - nextcloud-net\n\n  onlyoffice:\n    image: onlyoffice/documentserver\n    container_name: nextcloud-docs\n    restart: unless-stopped\n    environment:\n             function populateNoteList() {
                let txt = `<h1 style="text-align:center; font-size:52px;"><u>Notes</u></h1>`;
                for (let i=0; i<notes.length; i++) {
                    txt += `<button onclick="runNote(${i})" style="height:50px;">${notes[i][1]}</button>`;
                }
                noteList.innerHTML = txt;
            }

            function runNote(id = 0) {
                switch(notes[id][0]) {
                    case "HTML":
                        noteArea.innerHTML = notes[id][2];
                        noteList.style.top = "-100%";
                        break;
                    case "TXT":
                        noteArea.innerHTML = ``;
                        const txtArea = document.createElement("textarea");
                        txtArea.style.cssText = "width:100%; height:100%; padding:10px; font-size:16px; border:0px; resize:none; outline:none;";
                        txtArea.value = notes[id][2];
                        txtArea.addEventListener("keydown", () => {
                            notes[id][2] = txtArea.value;
                        })
                        noteArea.appendChild(txtArea);
                        noteList.style.top = "-100%";
                        break;
                    case "JS":
                        const newFunc = new Function('index', notes[id][2]);
                        newFunc(id);
                }
            }

            async function saveNotes(save = true) {
                const db = await new Promise((res, rej) => {
                    const r = indexedDB.open("notesDB", 1);
                    r.onupgradeneeded = () => r.result.createObjectStore("notesDB");
                    r.onsuccess = () => res(r.result);
                    r.onerror = () => rej(r.error);
                });

                const tx = db.transaction("notesDB", "readwrite");
                const store = tx.objectStore("notesDB");
                const key = "notes";

                return new Promise((res, rej) => {
                    const req = save ? store.put(notes, key) : store.get(key);
                    req.onsuccess = () => {
                        if (!save) {
                            if (req.result) notes = req.result;
                            populateNoteList();
                            runNote();
                        }
                        res(req.result);
                    };
                    req.onerror = () => rej(req.error);
                });
            }

            saveNotes(false);
