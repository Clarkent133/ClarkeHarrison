le = 0, endAngle = 360) {\n    ctx.beginPath();\n    ctx.arc(x, y, r, startAngle*(Math.PI / 180), endAngle*(Math.PI / 180));\n    ctx.fillStyle = colour;\n    ctx.fill();\n}\n\n\n\nfunction drawText(x,y,w,h,t,font=\"36px sans-serif\"){\n    ctx.fillStyle=\"#000000\"; ctx.save(); ctx.font=font; ctx.textAlign=\"center\"; ctx.textBaseline=\"alphabetic\";\n  const m=ctx.measureText(\"Mg\"), a=m.actualBoundingBoxAscent||0, d=m.actualBoundingBoxDescent||0,\n        fs=parseFloat(/(\\d+(?:\\.\\d+)?)px/.exec(ctx.font)?.[1]||16),\n        lh=a+d||fs*1.2, asc=a||fs*.8, cx=x+w/2;\n  const wrap=s=>{\n    const L=[], mw=w;\n    for(const p of s.split(/\\r?\\n/)){ let l=\"\";\n      for(const w2 of p.split(/\\s+/)){\n        if(ctx.measureText(w2).width>mw){\n          if(l) L.push(l),l=\"\";\n          let c=\"\"; for(const ch of w2){\n            const t2=c+ch; ctx.measureText(t2).width<=mw?c=t2:(L.push(c),c=ch);\n          } l=c; continue;\n        }\n        const t2=l?l+\" \"+w2:w2;\n        ctx.measureText(t2).width<=mw?l=t2:(L.push(l),l=w2);\n      }\n      L.push(l);\n    } return L;\n  };\n  const lines=wrap(t), bh=lines.length*lh, sy=y+(h-bh)/2+asc;\n  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();\n  lines.forEach((l,i)=>ctx.fillText(l,cx,sy+i*lh));\n  ctx.restore();\n}\n\n\n\n\n\n\n\n\n\n\n"

            function populateNoteList() {
                let txt = `<h1 style="text-align:center; font-size:52px;"><u>Notes</u></h1>`;
                for (let i=0; i<notes.length; i++) {
                    txt += `<button onclick="runNote(${i})" style="height:50px;">${notes[i][1]}</button>`;
                }
                noteList.innerHTML = txt;
            }

            function runNote(id = 0) {
                switch(notes[id][0]) {
                    case "HTML":
                        noteArea.innerHTML = notes[id][2];
                        noteList.style.top = "-100%";
                        break;
                    case "TXT":
                        noteArea.innerHTML = ``;
                        const txtArea = document.createElement("textarea");
                        txtArea.style.cssText = "width:100%; height:100%; padding:10px; font-size:16px; border:0px; resize:none; outline:none;";
                        txtArea.value = notes[id][2];
                        txtArea.addEventListener("keydown", () => {
                            notes[id][2] = txtArea.value;
                        })
                        noteArea.appendChild(txtArea);
                        noteList.style.top = "-100%";
                        break;
                    case "JS":
                        const newFunc = new Function('index', notes[id][2]);
                        newFunc(id);
                }
            }

            async function saveNotes(save = true) {
                const db = await new Promise((res, rej) => {
                    const r = indexedDB.open("notesDB", 1);
                    r.onupgradeneeded = () => r.result.createObjectStore("notesDB");
                    r.onsuccess = () => res(r.result);
                    r.onerror = () => rej(r.error);
                });

                const tx = db.transaction("notesDB", "readwrite");
                const store = tx.objectStore("notesDB");
                const key = "notes";

                return new Promise((res, rej) => {
                    const req = save ? store.put(notes, key) : store.get(key);
                    req.onsuccess = () => {
                        if (!save) {
                            if (req.result) notes = req.result;
                            populateNoteList();
                            runNote();
                        }
                        res(req.result);
                    };
                    req.onerror = () => rej(req.error);
                });
            }

            saveNotes(false);

        </script>

        <script>
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("/service-worker.js");
            }
        </script>

    </body>
</html>
