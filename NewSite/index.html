    <body style="padding:0px; margin:0px; height:100dvh;">

        <div id="customHTML" style="height:100%; overflow-y:auto; scrollbar-width:none; transition:all 0.3s ease-in-out;"></div>

        <script>

            let pages = {
    "Home": {
        "HTML": "<div id=\"header\">\n    <button onclick=\"editPage('Home')\">Edit</button>\n    <button onclick=\"showPage('ClickandTreatTraining');\">ClickandTreatTraining</button>\n    <button onclick=\"if (prompt('Are you sure?') == 'Yes') indexedDB.deleteDatabase('pagesDB'); window.location.reload();\">Reset Changes</button>\n</div>\n<textarea id=\"notesArea\" style=\"width:calc(100% - 44px); height:300px; border:solid black 2px; margin:10px; padding:10px;\"></textarea>\n<br>\n<canvas id=\"cnv\" width=\"400\" height=\"300\" style=\"width:400px; height:300px; border:solid black 2px;\"></canvas>\n<br>\n",
        "CSS": "#header {\n    width: calc(100% - 10px);\n    display: flex;\n    flex-direction: row-reverse;\n    gap: 10px;\n    padding: 5px;\n    background-color:gray;\n}\n\n\n\n\n",
        "JS": "/*\n??? What i want for the homepage of my site ???\n\n- Website Builder ?\n\n\n*/\n\n\nconst notesArea = document.getElementById(\"notesArea\");\nconst cnv = document.getElementById(\"cnv\");\nconst ctx = cnv.getContext(\"2d\");\n\n\nif (!(\"Notes\" in pages[\"Home\"])) pages[\"Home\"][\"Notes\"] = \"\";\nnotesArea.value = pages[\"Home\"][\"Notes\"];\nnotesArea.addEventListener(\"input\", function() {\n    pages[\"Home\"][\"Notes\"] = this.value;\n    savePages();\n});\n\n\nctx.fillStyle = \"red\";\nctx.fillRect(20,20,40,40);\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nwindow.editPage = function(pageName='Home') {\n    if (!(pageName in pages)) pages[pageName] = {\"HTML\" : \"\" , \"CSS\" : \"\" , \"JS\" : \"\"};\n\n    customHTML.innerHTML += `\n        <div style=\"width:calc(100% - 50px); height:calc(100% - 50px); display:flex; flex-direction:column; gap:10px; background-color:white; position:fixed; top:0px; z-index:10; border:solid black 5px; border-radius:8px; margin:10px; padding:10px;\">\n            <div style=\"width:100%; min-height:40px; height:40px; display:flex; gap:10px;\">\n                <button id=\"showHTMLArea\" style=\"width:100%; height:100%; border-radius: 8px; box-shadow: 1px 1px 2px grey; font-size: 24px; background-color: white; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;\">HTML</button>\n                <button id=\"showCSSArea\" style=\"width:100%; height:100%; border-radius: 8px; box-shadow: 1px 1px 2px grey; font-size: 24px; background-color: white; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;\">CSS</button>\n                <button id=\"showJSArea\" style=\"width:100%; height:100%; border-radius: 8px; box-shadow: 1px 1px 2px grey; font-size: 24px; background-color: white; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;\">JS</button>\n            </div>\n            <textarea id=\"htmlEditArea\" wrap=\"off\" style=\"width:calc(100% - 24px); height:calc(100% - 22px); display:none; padding:10px; border:solid black 2px; resize:none;\"></textarea>\n            <textarea id=\"cssEditArea\" wrap=\"off\" style=\"width:calc(100% - 24px); height:calc(100% - 22px); display:none; padding:10px; border:solid black 2px; resize:none;\"></textarea>\n            <textarea id=\"jsEditArea\" wrap=\"off\" style=\"width:calc(100% - 24px); height:calc(100% - 22px); display:none; padding:10px; border:solid black 2px; resize:none;\"></textarea>\n            <div style=\"width:100%; min-height:40px; height:40px; display:flex; gap:10px;\">\n                <button id=\"showPageButton\" style=\"width:100%; height:100%; border-radius: 8px; box-shadow: 1px 1px 2px grey; font-size: 24px; background-color: white; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;\">Show Page</button>\n                <button id=\"savePageButton\" style=\"width:100%; height:100%; border-radius: 8px; box-shadow: 1px 1px 2px grey; font-size: 24px; background-color: white; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;\">Save</button>\n            </div>\n        </div>\n    `;\n\n    const showHTMLArea = document.getElementById('showHTMLArea');\n    const showCSSArea = document.getElementById('showCSSArea');\n    const showJSArea = document.getElementById('showJSArea');\n\n    const htmlEditArea = document.getElementById('htmlEditArea');\n    const cssEditArea = document.getElementById('cssEditArea');\n    const jsEditArea = document.getElementById('jsEditArea');\n\n    const showPageButton = document.getElementById('showPageButton');\n    const savePageButton = document.getElementById('savePageButton');\n\n    showHTMLArea.onclick = function() {showEditingArea(\"HTML\");};\n    showCSSArea.onclick = function() {showEditingArea(\"CSS\");};\n    showJSArea.onclick = function() {showEditingArea(\"JS\");};\n\n    htmlEditArea.value = pages[pageName]['HTML'];\n    cssEditArea.value = pages[pageName]['CSS'];\n    jsEditArea.value = pages[pageName]['JS'];\n\n    htmlEditArea.addEventListener(\"input\", updatePages);\n    cssEditArea.addEventListener(\"input\", updatePages);\n    jsEditArea.addEventListener(\"input\", updatePages);\n\n    htmlEditArea.addEventListener(\"keydown\", tabFunctionality);\n    cssEditArea.addEventListener(\"keydown\", tabFunctionality);\n    jsEditArea.addEventListener(\"keydown\", tabFunctionality);\n\n    function showEditingArea(type) {\n        htmlEditArea.style.display = (type == \"HTML\") ? \"block\" : \"none\";\n        cssEditArea.style.display = (type == \"CSS\") ? \"block\" : \"none\";\n        jsEditArea.style.display = (type == \"JS\") ? \"block\" : \"none\";\n\n        showHTMLArea.style.border = (type == \"HTML\") ? \"solid blue 4px\" : \"solid black 1px\";\n        showCSSArea.style.border = (type == \"CSS\") ? \"solid blue 4px\" : \"solid black 1px\";\n        showJSArea.style.border = (type == \"JS\") ? \"solid blue 4px\" : \"solid black 1px\";\n    }\n\n    showEditingArea(\"HTML\");\n\n    function updatePages() {\n        pages[pageName]['HTML'] = htmlEditArea.value;\n        pages[pageName]['CSS'] = cssEditArea.value;\n        pages[pageName]['JS'] = jsEditArea.value;\n        savePages();\n    }\n\n    function tabFunctionality(e) {\n        if (e.key === \"Tab\") {\n            e.preventDefault();\n            const start = this.selectionStart;\n            const end = this.selectionEnd;\n            this.value = this.value.substring(0, start) + \"    \" + this.value.substring(end);\n            this.selectionStart = this.selectionEnd = start + 4;\n        }  \n    }\n\n    showPageButton.onclick = function() {\n        showPage(pageName);\n    };\n\n    savePageButton.onclick = function() {\n        navigator.clipboard.writeText(\"let pages = \" + JSON.stringify(pages, null, 4) + \";\");\n        alert(\"Saved to Clipboard !\");\n    }\n}\n\n",
        "Notes": ""
    },
    "ClickandTreatTraining": {
        "HTML": "<button onclick=\"editPage('ClickandTreatTraining')\">Edit Website Builder</button>\n\n\n<div style=\"height:500px; position:relative; background-color:grey;\">\n    <img style=\"width:160px; height:160px; position:relative; top:30px; left:30px; border-radius:600px;\"></img>\n    <div class=\"fadeUp\">\n        <h1 style=\"color:white;\">Personalised 1-2-1 Dog Training</h1>\n        <p style=\"color:white;\">Building trust, one click at a time!</p>\n    </div>\n</div>\n\n\n<canvas></canvas>\n\n\n<div class=\"section wrap\" style=\"background-color:#D9F6FA;\">\n    <img class=\"sub\" style=\"width:100%; height:100%; border-radius:400px;\"></img>\n    <div class=\"sub\">\n        <h3>Meet the trainer behind the treats</h3>\n        <p>Hi, I'm Chloe, and I believe in positive reinforcement training. I am passionate about helping dogs and their owners build lasting, trust based relationships.</p>\n        <p>My training methods are force-free, reward-based, and adapted to suit your dog's personality. Whether you're working on puppy foundations, lead skills, recall, reactivity, confidence building, or muzzle training, I'm here to support you every step of the way.</p>\n        <p>My dog, Zuri, is the reason behind everything I do. She is reactive through fear to certain things, and this inspired me to start training. Through our journey, we built a deeper connection, and I found a love for training dogs. Training not only helped her, it strengthened our relationship, helping us become best friends.</p>\n        <p>I offer 1-2-1 dog training and hope to one day expand my business to include a secure dog field and an indoor training space, providing a safe and enriching experience for every dog. </p>\n        <p>Let's train with love and kindness, because good relationships start with trust. </p>\n        <p>I am a registered dog trainer with the <b>Animal Behaviour & Training Council (ABTC)</b>, with over six years of hands-on experience working with and training dogs through two of the UK's largest animal welfare charities.</p>\n        <p>My qualifications include:\n        <ul>\n            <li><b>Canine Behaviour Professional – Accredited Diploma</b></li>\n            <br>\n            <li><b>Canine Reactive Behaviour – Accredited Advanced Certificate</b></li>\n            <br>\n            <li><b>CPD Certified – Canine Fear Course</b></li>\n            <br>\n            <li><b>Animal First Aid Trained</b></li>\n            <br>\n            <li><b>Currently studying</b>: Level 4 Diploma in Canine Welfare, Training & Behaviour</li>\n            <br>\n            <li><b>Professional Member</b> of the <b>National Institute for Canine Ethics</b></li>\n        </ul>\n        <p>With a strong skill set in both practical hands-on experience and academic learning, I am dedicated to promoting ethical, welfare-focused dog training.</p>\n        <div class=\"wrap\" style=\"gap:10px;\">\n            <img></img>\n            <img></img>\n            <img></img>\n        </div>\n    </div>\n</div>\n\n\n<canvas></canvas>\n\n\n<div class=\"section wrap\" style=\"background-color:#F0F0F0;\">\n    <div class=\"sub\"></div>\n    <div class=\"sub\"></div>\n</div>\n\n\n<canvas></canvas>\n\n\n<div class=\"section wrap\" style=\"background-color:#F7F3B7;\">\n    <div class=\"sub\"></div>\n    <div class=\"sub\"></div>\n</div>\n\n\n<canvas></canvas>\n\n\n<div class=\"section wrap\" style=\"background-color:#D9F6FA;\">\n    <div class=\"sub\"></div>\n    <div class=\"sub\"></div>\n</div>\n\n",
        "CSS": ".section {\n    min-height:200px;\n    width: 90%;\n    padding: 5%;\n    gap: 80px;\n    background-color: grey;\n}\n\n.sub {\n    min-width: 100px;\n    max-width: 500px;\n    min-height: 100px;\n    text-align: center;\n}\n\n.wrap {\n    display: flex;\n    flex-wrap: wrap;\n    justify-content: center;\n    align-items: center;\n    text-align: center;\n}\n\n.fadeUp {\n    width: 100%;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    align-items: center;\n    transition: all 1s ease-in-out;\n    position: relative;\n    top: 150px;\n    opacity: 0;\n}\n\ncanvas {\n    width: 100%;\n    height: 60px;\n    display: block;\n}\n\nh1, h2, h3, h4, h5 {\n    margin: 0px;\n    font-family: \"MyFont1\", sans-serif;\n    text-align: center;\n}\n\n\nh1 {\n    font-size: 64px;\n}\n\nh3 {\n    font-size: 36px;\n}\n\np , ul , li {\n    font-family: \"MyFont2\", sans-serif;\n    color: rgb(100,100,100);\n    text-align: left;\n}\n",
        "JS": "customCSS.innerHTML += `\n    @font-face {\n        font-family: 'MyFont1';\n        src: url('https://clarkent133.github.io/ClickAndTreatTraining/font1.ttf') format('truetype');\n        font-weight: normal;\n        font-style: normal;\n        font-display: swap;\n    }\n    @font-face {\n        font-family: 'MyFont2';\n        src: url('https://clarkent133.github.io/ClickAndTreatTraining/font2.ttf') format('truetype');\n        font-weight: normal;\n        font-style: normal;\n        font-display: swap;\n    }\n\n\n`;\n\nconst backgroundColours = [\n    \"grey\",\n    \"#D9F6FA\",\n    \"#F0F0F0\",\n    \"#F7F3B7\",\n    \"#D9F6FA\",\n    \"grey\"\n]\n\ndocument.querySelectorAll(\"canvas\").forEach((cnv, index) => {\n    const ctx = cnv.getContext(\"2d\");\n    cnv.width = 1000;\n    cnv.height = 500;\n\n    ctx.fillStyle = backgroundColours[index];\n    ctx.fillRect(0, 0, cnv.width, cnv.height);\n\n    ctx.beginPath();\n    ctx.arc(500, 500, 500, 0, Math.PI * 2, false);\n    ctx.fillStyle = backgroundColours[index + 1];\n    ctx.fill();\n\n\n})\n\ndocument.querySelectorAll(\"img\").forEach((elem, index) => {\n    elem.src = \"https://clarkent133.github.io/ClickAndTreatTraining/paw.png\";\n});\n\nrequestAnimationFrame(() => {\n    document.querySelectorAll(\".fadeUp\").forEach((elem, index) => {\n        elem.style.top = \"70px\";\n        elem.style.opacity = 1;\n    })\n});\n\n\n\n\n\n\n/*\n@font-face {\n  font-family: 'Quicksand';\n  font-style: normal;\n  font-weight: 300 700;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/quicksand/v37/6xKtdSZaM9iE8KbpRA_hJFQNcOM.woff2) format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n@font-face {\n  font-family: 'Quicksand';\n  font-style: normal;\n  font-weight: 300 700;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/quicksand/v37/6xKtdSZaM9iE8KbpRA_hJVQNcOM.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n@font-face {\n  font-family: 'Quicksand';\n  font-style: normal;\n  font-weight: 300 700;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/quicksand/v37/6xKtdSZaM9iE8KbpRA_hK1QN.woff2) format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n*/"
    }
};

            const customHTML = document.getElementById("customHTML");
            const customCSS = document.getElementById("customCSS");

            function showPage(pageName="Home") {
                customHTML.style.opacity = 0;
                setTimeout(() => {
                    customHTML.innerHTML = pages[pageName]["HTML"];
                    customCSS.innerHTML = pages[pageName]["CSS"];
                    new Function(pages[pageName]["JS"])();
                    requestAnimationFrame(() => {customHTML.style.opacity = 1;})
                }, 300);

            }

            async function savePages(save = true) {
                const db = await new Promise((res, rej) => {
                    const r = indexedDB.open("pagesDB", 1);
                    r.onupgradeneeded = () => r.result.createObjectStore("pagesDB");
                    r.onsuccess = () => res(r.result);
                    r.onerror = () => rej(r.error);
                });

                const tx = db.transaction("pagesDB", "readwrite");
                const store = tx.objectStore("pagesDB");
                const key = "pages";

                return new Promise((res, rej) => {
                    const req = save ? store.put(pages, key) : store.get(key);
                    req.onsuccess = () => {
                        if (!save) {
                            if (req.result) pages = req.result;
                            showPage();
                        }
                        res(req.result);
                    };
                    req.onerror = () => rej(req.error);
                });
            }

            savePages(false);

        </script>
