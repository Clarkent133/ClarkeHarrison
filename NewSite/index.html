<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- <link rel="manifest" href="/manifest.json"> -->
        <title>CH</title>

        <!-- <link rel="icon" type="image/png" href="./CATT.png"> -->
        <style id="customCSS"></style>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    </head>
    <body style="padding:0px; margin:0px; height:100dvh;">

        <div id="customHTML" style="height:100%; overflow-y:auto; scrollbar-width:none;"></div>

        <script src="https://clarkeharrison.co.uk/qrCode.js"></script>

        <script>

            let pages = {
    "Home": {
        "HTML": "<div id=\"header\">\n    <button onclick=\"editPage('Home')\">Edit Home</button>\n    <button onclick=\"editPage('Notes')\">Edit Notes</button>\n</div>\n<textarea id=\"notesArea\" style=\"width:calc(100% - 44px); height:300px; border:solid black 2px; margin:10px; padding:10px;\"></textarea>\n<br>\n<canvas id=\"cnv\" width=\"400\" height=\"300\" style=\"width:400px; height:300px; border:solid black 2px;\"></canvas>\n<br>\n",
        "CSS": "button {\n    border-radius: 8px;\n    box-shadow: 1px 1px 2px grey;\n    font-size: 24px;\n    background-color: white;\n    cursor: pointer;\n    user-select: none;\n    -webkit-tap-highlight-color: transparent;\n}\n\n#header {\n    width: calc(100% - 10px);\n    display: flex;\n    flex-direction: row-reverse;\n    gap: 10px;\n    padding: 5px;\n    background-color:gray;\n}\n\n\n\n\n",
        "JS": "/*\n??? What i want for the homepage of my site ???\n\n- Website Builder ?\n\n\n*/\n\n\nconst notesArea = document.getElementById(\"notesArea\");\nconst cnv = document.getElementById(\"cnv\");\nconst ctx = cnv.getContext(\"2d\");\n\n\nif (!(\"Notes\" in pages[\"Home\"])) pages[\"Home\"][\"Notes\"] = \"\";\nnotesArea.value = pages[\"Home\"][\"Notes\"];\nnotesArea.addEventListener(\"input\", function() {\n    pages[\"Home\"][\"Notes\"] = this.value;\n    savePages();\n});\n\n\nctx.fillStyle = \"red\";\nctx.fillRect(20,20,40,40);\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nwindow.editPage = function(pageName='Home') {\n    if (!(pageName in pages)) pages[pageName] = {\"HTML\" : \"\" , \"CSS\" : \"\" , \"JS\" : \"\"};\n\n    customHTML.innerHTML = `\n        <div style=\"width:calc(100% - 50px); height:calc(100% - 50px); display:flex; flex-direction:column; gap:10px; border:solid black 5px; border-radius:8px; margin:10px; padding:10px;\">\n            <div style=\"width:100%; min-height:40px; height:40px; display:flex; gap:10px;\">\n                <button id=\"showHTMLArea\" style=\"width:100%; height:100%;\">HTML</button>\n                <button id=\"showCSSArea\" style=\"width:100%; height:100%;\">CSS</button>\n                <button id=\"showJSArea\" style=\"width:100%; height:100%;\">JS</button>\n            </div>\n            <textarea id=\"htmlEditArea\" wrap=\"off\" style=\"width:calc(100% - 24px); height:calc(100% - 22px); display:none; padding:10px; border:solid black 2px; resize:none;\"></textarea>\n            <textarea id=\"cssEditArea\" wrap=\"off\" style=\"width:calc(100% - 24px); height:calc(100% - 22px); display:none; padding:10px; border:solid black 2px; resize:none;\"></textarea>\n            <textarea id=\"jsEditArea\" wrap=\"off\" style=\"width:calc(100% - 24px); height:calc(100% - 22px); display:none; padding:10px; border:solid black 2px; resize:none;\"></textarea>\n            <div style=\"width:100%; min-height:40px; height:40px; display:flex; gap:10px;\">\n                <button id=\"showPageButton\" style=\"width:100%; height:100%;\">Show Page</button>\n                <button id=\"savePageButton\" style=\"width:100%; height:100%;\">Save</button>\n            </div>\n        </div>\n    `;\n\n    const showHTMLArea = document.getElementById('showHTMLArea');\n    const showCSSArea = document.getElementById('showCSSArea');\n    const showJSArea = document.getElementById('showJSArea');\n\n    const htmlEditArea = document.getElementById('htmlEditArea');\n    const cssEditArea = document.getElementById('cssEditArea');\n    const jsEditArea = document.getElementById('jsEditArea');\n\n    const showPageButton = document.getElementById('showPageButton');\n    const savePageButton = document.getElementById('savePageButton');\n\n    showHTMLArea.onclick = function() {showEditingArea(\"HTML\");};\n    showCSSArea.onclick = function() {showEditingArea(\"CSS\");};\n    showJSArea.onclick = function() {showEditingArea(\"JS\");};\n\n    htmlEditArea.value = pages[pageName]['HTML'];\n    cssEditArea.value = pages[pageName]['CSS'];\n    jsEditArea.value = pages[pageName]['JS'];\n\n    htmlEditArea.addEventListener(\"input\", updatePages);\n    cssEditArea.addEventListener(\"input\", updatePages);\n    jsEditArea.addEventListener(\"input\", updatePages);\n\n    htmlEditArea.addEventListener(\"keydown\", tabFunctionality);\n    cssEditArea.addEventListener(\"keydown\", tabFunctionality);\n    jsEditArea.addEventListener(\"keydown\", tabFunctionality);\n\n    function showEditingArea(type) {\n        htmlEditArea.style.display = (type == \"HTML\") ? \"block\" : \"none\";\n        cssEditArea.style.display = (type == \"CSS\") ? \"block\" : \"none\";\n        jsEditArea.style.display = (type == \"JS\") ? \"block\" : \"none\";\n\n        showHTMLArea.style.border = (type == \"HTML\") ? \"solid blue 4px\" : \"solid black 1px\";\n        showCSSArea.style.border = (type == \"CSS\") ? \"solid blue 4px\" : \"solid black 1px\";\n        showJSArea.style.border = (type == \"JS\") ? \"solid blue 4px\" : \"solid black 1px\";\n    }\n\n    showEditingArea(\"HTML\");\n\n    function updatePages() {\n        pages[pageName]['HTML'] = htmlEditArea.value;\n        pages[pageName]['CSS'] = cssEditArea.value;\n        pages[pageName]['JS'] = jsEditArea.value;\n        savePages();\n    }\n\n    function tabFunctionality(e) {\n        if (e.key === \"Tab\") {\n            e.preventDefault();\n            const start = this.selectionStart;\n            const end = this.selectionEnd;\n            this.value = this.value.substring(0, start) + \"    \" + this.value.substring(end);\n            this.selectionStart = this.selectionEnd = start + 4;\n        }  \n    }\n\n    showPageButton.onclick = function() {\n        showPage(pageName);\n    };\n\n    savePageButton.onclick = function() {\n        navigator.clipboard.writeText(\"let pages = \" + JSON.stringify(pages, null, 4) + \";\");\n        alert(\"Saved to Clipboard !\");\n    }\n}\n\n"
    }
};

            const customHTML = document.getElementById("customHTML");
            const customCSS = document.getElementById("customCSS");

            function showPage(pageName="Home") {
                customHTML.innerHTML = pages[pageName]["HTML"];
                customCSS.innerHTML = pages[pageName]["CSS"];
                new Function(pages[pageName]["JS"])();
            }

            async function savePages(save = true) {
                const db = await new Promise((res, rej) => {
                    const r = indexedDB.open("pagesDB", 1);
                    r.onupgradeneeded = () => r.result.createObjectStore("pagesDB");
                    r.onsuccess = () => res(r.result);
                    r.onerror = () => rej(r.error);
                });

                const tx = db.transaction("pagesDB", "readwrite");
                const store = tx.objectStore("pagesDB");
                const key = "pages";

                return new Promise((res, rej) => {
                    const req = save ? store.put(pages, key) : store.get(key);
                    req.onsuccess = () => {
                        if (!save) {
                            if (req.result) pages = req.result;
                            showPage();
                        }
                        res(req.result);
                    };
                    req.onerror = () => rej(req.error);
                });
            }

            savePages(false);

        </script>

        <script>
            // if ("serviceWorker" in navigator) {
            //     navigator.serviceWorker.register("/service-worker.js");
            // }
        </script>
    </body>
</html>
